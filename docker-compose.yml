services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 3s
      retries: 20
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:${DB_PASSWORD:-change-me}@db:5432/attendance
      SECRET_KEY: ${SECRET_KEY:-change-me-too}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
